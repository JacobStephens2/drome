name: infra-ci

# plan.md GitOps "Infra pipeline":
#   PR            -> fmt + init(-backend=false) + validate, and plan posted as a
#                    PR comment (validate needs NO secrets; it is the always-on
#                    gate that runs the real provider-schema check on Linux,
#                    where Santa can't SIGKILL the plugins the way it does on the
#                    author's Mac).
#   push to main  -> apply, behind the `infra` GitHub environment (manual
#                    approval).
#   weekly cron   -> `tofu plan -detailed-exitcode` drift check; opens/updates an
#                    issue if live infra no longer matches git.
#
# plan/apply/drift are gated on the repo variable INFRA_ENABLED == 'true' so this
# stays green BEFORE the deploy milestone (no infra env / secrets exist yet).
# Flip INFRA_ENABLED to 'true' once the `infra` environment secrets are set.

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra-ci.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra-ci.yml"]
  schedule:
    - cron: "17 8 * * 1" # Mondays 08:17 UTC — drift check
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  TOFU_VERSION: "1.12.3"

defaults:
  run:
    working-directory: infra

jobs:
  # Always-on gate: no cloud creds. This is the DoD check (fmt clean + provider
  # schema validate).
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # validate/init do NO state I/O, so the encryption block's passphrase is
      # never actually used here — but the config references the var, so set a
      # throwaway (>=16 chars) to keep this secret-free gate green. NOT a real
      # passphrase and never encrypts anything.
      TF_VAR_state_encryption_passphrase: "ci-validate-inert-passphrase"
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: fmt
        run: tofu fmt -check -recursive
      - name: init (no backend)
        run: tofu init -backend=false -input=false
      - name: validate
        run: tofu validate

  plan:
    if: github.event_name == 'pull_request' && vars.INFRA_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: infra
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_state_encryption_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_deploy_user_public_key: ${{ secrets.DEPLOY_USER_PUBLIC_KEY }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ secrets.TF_STATE_BUCKET }}"
          key    = "${{ secrets.TF_STATE_KEY }}"
          endpoints = { s3 = "${{ secrets.TF_STATE_ENDPOINT }}" }
          EOF
      - name: init
        run: tofu init -input=false -backend-config=backend.hcl
      - name: plan
        run: tofu plan -no-color -input=false -out=tfplan | tee plan.txt
      - name: Comment plan on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## OpenTofu plan'
            echo
            echo '```'
            head -c 60000 plan.txt
            echo
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  apply:
    if: github.event_name == 'push' && vars.INFRA_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: infra # required reviewers here = the manual approval gate
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_state_encryption_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_deploy_user_public_key: ${{ secrets.DEPLOY_USER_PUBLIC_KEY }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ secrets.TF_STATE_BUCKET }}"
          key    = "${{ secrets.TF_STATE_KEY }}"
          endpoints = { s3 = "${{ secrets.TF_STATE_ENDPOINT }}" }
          EOF
      - name: init
        run: tofu init -input=false -backend-config=backend.hcl
      - name: Snapshot state before apply (R2 has no object versioning)
        env:
          STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          STATE_KEY: ${{ secrets.TF_STATE_KEY }}
          STATE_ENDPOINT: ${{ secrets.TF_STATE_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
        run: |
          # R2 can't roll back a bad state write (no S3 versioning), so keep a
          # timestamped copy of the already-encrypted state object before every
          # apply. Restore = copy a backups/ object back onto the live key.
          # Expire old copies with an R2 lifecycle rule on the backups/ prefix.
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          if aws s3api head-object --bucket "$STATE_BUCKET" --key "$STATE_KEY" \
               --endpoint-url "$STATE_ENDPOINT" >/dev/null 2>&1; then
            aws s3 cp "s3://$STATE_BUCKET/$STATE_KEY" \
              "s3://$STATE_BUCKET/backups/$STATE_KEY.$TS" \
              --endpoint-url "$STATE_ENDPOINT"
            echo "Backed up state → backups/$STATE_KEY.$TS"
          else
            echo "No prior state object — first apply, nothing to back up."
          fi
      - name: apply
        run: tofu apply -no-color -input=false -auto-approve

  drift:
    if: github.event_name == 'schedule' && vars.INFRA_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: infra
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_state_encryption_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_deploy_user_public_key: ${{ secrets.DEPLOY_USER_PUBLIC_KEY }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket = "${{ secrets.TF_STATE_BUCKET }}"
          key    = "${{ secrets.TF_STATE_KEY }}"
          endpoints = { s3 = "${{ secrets.TF_STATE_ENDPOINT }}" }
          EOF
      - name: init
        run: tofu init -input=false -backend-config=backend.hcl
      - name: drift plan
        id: plan
        run: |
          set +e
          tofu plan -detailed-exitcode -no-color -input=false -lock=false > drift.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat drift.txt
          # 0 = no drift, 2 = drift, 1 = error
          [ "$code" = "1" ] && exit 1 || exit 0
      - name: Open/update drift issue
        if: steps.plan.outputs.exit_code == '2'
        run: |
          gh label create infra-drift --color b60205 --description "Live infra differs from git" 2>/dev/null || true
          body=$(printf '## Infra drift detected\n\nLive infrastructure no longer matches git. `tofu plan` diff:\n\n```\n%s\n```\n' "$(head -c 60000 drift.txt)")
          existing=$(gh issue list --label infra-drift --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Infra drift detected ($(date -u +%F))" --label infra-drift --body "$body"
          fi
