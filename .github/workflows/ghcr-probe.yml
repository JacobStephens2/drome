name: ghcr-probe

# Temporary diagnostic for issue 5. Not part of the deploy pipeline.
# Push to issue-5 only, and only when this file changes.

on:
  push:
    branches: [issue-5]
    paths:
      - ".github/workflows/ghcr-probe.yml"

permissions:
  contents: read
  packages: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read the existing drome-server package with the Actions token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "=== GET /user/packages/container/drome-server ==="
          gh api /user/packages/container/drome-server
          echo
          echo "=== versions ==="
          gh api "/user/packages/container/drome-server/versions?per_page=5"
          echo

  push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            package: drome-probe-plain
            provenance: false
          - name: provenance
            package: drome-probe-prov
            provenance: true
    steps:
      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Dockerfile
        run: |
          mkdir -p /tmp/probe
          cat > /tmp/probe/Dockerfile <<EOF
          FROM alpine:3.20
          LABEL org.opencontainers.image.source=https://github.com/${{ github.repository }}
          LABEL org.opencontainers.image.description=issue 5 probe ${{ matrix.name }}
          EOF
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.OWNER_LC }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: /tmp/probe
          file: /tmp/probe/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: ${{ matrix.provenance }}
          sbom: false
          tags: ghcr.io/${{ env.OWNER_LC }}/${{ matrix.package }}:probe
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
