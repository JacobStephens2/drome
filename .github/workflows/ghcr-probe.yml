name: ghcr-probe

# Temporary diagnostic for issue 5. Not part of the deploy pipeline.

on:
  push:
    branches: [issue-5]
    paths:
      - ".github/workflows/ghcr-probe.yml"

permissions:
  contents: read
  packages: write

jobs:
  push-plain:
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Dockerfile
        run: |
          mkdir -p /tmp/probe
          cat > /tmp/probe/Dockerfile <<EOF
          FROM alpine:3.20
          LABEL org.opencontainers.image.source=https://github.com/${{ github.repository }}
          LABEL org.opencontainers.image.description="issue-5 probe plain"
          EOF
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.OWNER_LC }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push drome-server without provenance
        uses: docker/build-push-action@v6
        with:
          context: /tmp/probe
          file: /tmp/probe/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ env.OWNER_LC }}/drome-server:ci-probe-plain
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  push-provenance:
    needs: push-plain
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Dockerfile
        run: |
          mkdir -p /tmp/probe
          cat > /tmp/probe/Dockerfile <<EOF
          FROM alpine:3.20
          LABEL org.opencontainers.image.source=https://github.com/${{ github.repository }}
          LABEL org.opencontainers.image.description="issue-5 probe provenance"
          EOF
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.OWNER_LC }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push drome-server with provenance
        uses: docker/build-push-action@v6
        with:
          context: /tmp/probe
          file: /tmp/probe/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: false
          tags: ghcr.io/${{ env.OWNER_LC }}/drome-server:ci-probe-prov
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  cleanup-probes:
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete the throwaway probe packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for name in drome-probe-plain drome-probe-prov; do
            echo "=== DELETE $name ==="
            gh api --method DELETE "/users/JacobStephens2/packages/container/${name}"
            echo
          done
