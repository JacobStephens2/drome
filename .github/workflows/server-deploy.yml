name: server-deploy

# plan.md GitOps "App pipeline": build the amd64 image, push to GHCR tagged with
# the git SHA (NEVER :latest), then deploy over SSH via deploy/deploy.sh.
#
# Path-filtered so an iOS-only commit never triggers a server deploy. The build
# is gated on a `test` job (fmt + clippy + tests) so a commit that merely
# compiles but fails tests/clippy — or a direct push to main — never reaches
# production; server-ci.yml still runs the same gate on PRs.
#
# Rollback: run this workflow manually (workflow_dispatch) with `rollback_sha`
# set to an earlier commit SHA; the image already exists in GHCR, so it skips the
# build and just re-deploys that SHA.
#
# The deploy job is gated on the repo variable DEPLOY_ENABLED == 'true' so the
# image builds on main BEFORE the droplet exists, but the SSH deploy only starts
# once the `deploy` environment secrets are in place (deploy milestone).

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "core/**"
      - "deploy/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/server-deploy.yml"
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Existing image git SHA to (re)deploy. Blank = build + deploy HEAD."
        required: false
        default: ""
      deploy_mode:
        description: "normal (default), fresh (first-ever empty DB), or restore (litestream restore from R2 first)."
        required: false
        default: "normal"
        type: choice
        options: ["normal", "fresh", "restore"]

permissions:
  contents: read
  packages: write

# IMAGE is computed per-job (GHCR requires a lowercase repository name, but
# github.repository_owner preserves case and Actions expressions have no lower()).

jobs:
  test:
    # Gate the whole deploy on the same checks as server-ci (fmt/clippy/tests) so
    # a green-compile-but-red-test commit — or a direct push to main — never
    # deploys. Only on push; a workflow_dispatch rollback re-deploys an image
    # whose SHA already passed this gate when it was first built.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> core/target"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  build:
    needs: test
    # Only build on push; a workflow_dispatch rollback reuses an existing image.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/drome-server" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push (amd64, tagged with git SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Run after a successful push-build, or directly on a rollback dispatch.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/drome-server" >> "$GITHUB_ENV"
      - name: Resolve image SHA (rollback input or HEAD)
        id: img
        run: |
          SHA="${{ github.event.inputs.rollback_sha }}"
          [ -z "$SHA" ] && SHA="${{ github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: SSH key + known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          KH="$HOME/.ssh/known_hosts"
          if [ -n "$DEPLOY_SSH_HOST_KEY" ]; then
            # Pinned host key (captured once after apply, stored as a deploy
            # secret). Real host authentication: a MITM impersonating DEPLOY_HOST
            # can't get us to hand it the GHCR token or the R2 secret we pipe over
            # this channel. StrictHostKeyChecking=yes REFUSES an unknown/changed key.
            printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > "$KH"
            chmod 644 "$KH"
            echo "SSH_OPTS=-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KH" >> "$GITHUB_ENV"
          else
            # No pinned key yet — genuine first-bootstrap ONLY. Trust-on-first-use;
            # capture `ssh-keyscan <DEPLOY_HOST>` into the DEPLOY_SSH_HOST_KEY secret
            # right after the first successful deploy to close this MITM window.
            echo "::warning::DEPLOY_SSH_HOST_KEY is not set — falling back to ssh-keyscan (trust-on-first-use). Capture the host key into the deploy secret after first boot."
            ssh-keyscan -H "$DEPLOY_HOST" >> "$KH" 2>/dev/null || true
            echo "SSH_OPTS=-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$KH" >> "$GITHUB_ENV"
          fi
      - name: Deploy
        run: |
          case "${{ github.event.inputs.deploy_mode }}" in
            fresh)   FLAG=--fresh ;;
            restore) FLAG=--restore ;;
            *)       FLAG= ;;
          esac
          ./deploy/deploy.sh $FLAG
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ steps.img.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          DROME_DOMAIN: ${{ vars.DROME_DOMAIN }}
          DATA_DIR: ${{ vars.DATA_DIR }}
          BETA_ALL_ENTITLED: ${{ vars.BETA_ALL_ENTITLED }}
          # Email OTP sign-in. Optional: unset → the server logs codes instead
          # of emailing. RESEND_FROM must be a verified sender on Resend.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          LITESTREAM_R2_ENDPOINT: ${{ secrets.LITESTREAM_R2_ENDPOINT }}
          LITESTREAM_R2_BUCKET: ${{ secrets.LITESTREAM_R2_BUCKET }}
          LITESTREAM_R2_ACCESS_KEY_ID: ${{ secrets.LITESTREAM_R2_ACCESS_KEY_ID }}
          LITESTREAM_R2_SECRET_ACCESS_KEY: ${{ secrets.LITESTREAM_R2_SECRET_ACCESS_KEY }}
