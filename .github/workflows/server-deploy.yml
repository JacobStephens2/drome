name: server-deploy

# plan.md GitOps "App pipeline": build the amd64 image, push to GHCR tagged with
# the git SHA (NEVER :latest), then deploy to stephens.page over SSH via
# deploy/deploy.sh, which asks the host's drome-deploy script to switch to it.
#
# Path-filtered so an iOS-only commit never triggers a server deploy. The build
# is gated on a `test` job (fmt + clippy + tests) so a commit that merely
# compiles but fails tests/clippy — or a direct push to main — never reaches
# production; server-ci.yml still runs the same gate on PRs.
#
# Rollback: run this workflow manually (workflow_dispatch) with `rollback_sha`
# set to an earlier commit SHA; the image already exists in GHCR, so it skips the
# build and just re-deploys that SHA.
#
# The deploy job is gated on the repo variable DEPLOY_ENABLED == 'true', and
# needs three secrets in the `deploy` environment: DEPLOY_HOST (stephens.page),
# DEPLOY_SSH_KEY (the drome-deploy CI key) and DEPLOY_SSH_HOST_KEY (the pinned
# `ssh-keyscan -t ed25519 stephens.page` line). App secrets (R2, Resend) are
# not in GitHub at all; they live in /srv/drome/.env on the host.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "core/**"
      - "deploy/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/server-deploy.yml"
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Existing image git SHA to (re)deploy. Blank = deploy HEAD."
        required: false
        default: ""
      deploy_mode:
        description: "normal (default), fresh (first-ever empty DB), or restore (litestream restore from R2 first)."
        required: false
        default: "normal"
        type: choice
        options: ["normal", "fresh", "restore"]

permissions:
  contents: read
  packages: write

# IMAGE is computed per-job (GHCR requires a lowercase repository name, but
# github.repository_owner preserves case and Actions expressions have no lower()).

jobs:
  test:
    # Gate the whole deploy on the same checks as server-ci (fmt/clippy/tests) so
    # a green-compile-but-red-test commit — or a direct push to main — never
    # deploys. Only on push; a workflow_dispatch rollback re-deploys an image
    # whose SHA already passed this gate when it was first built.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> core/target"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  build:
    needs: test
    # Only build on push; a workflow_dispatch rollback reuses an existing image.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/drome-server" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push (amd64, tagged with git SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Run after a successful push-build, or directly on a rollback dispatch.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v4
      # rollback_sha and deploy_mode are untrusted workflow_dispatch inputs.
      # Pass them in through env and accept them in this action (not a shell):
      # empty or a 40-hex SHA, and only normal/fresh/restore. Push does not
      # take the inputs; an empty rollback_sha still selects HEAD.
      - name: Accept rollback SHA and deploy mode
        id: deploy_inputs
        uses: actions/github-script@v9
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          ROLLBACK_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_sha || '' }}
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode || '' }}
        with:
          script: |
            const { acceptDeployInputs } = require('./deploy/accept-deploy-inputs.js');
            const accepted = acceptDeployInputs({
              eventName: process.env.EVENT_NAME,
              rollbackSha: process.env.ROLLBACK_SHA,
              deployMode: process.env.DEPLOY_MODE,
              headSha: process.env.HEAD_SHA,
            });
            core.setOutput('sha', accepted.sha);
            core.setOutput('mode', accepted.mode);
      - name: SSH key + known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          # The key is pinned on the host to /usr/local/bin/drome-deploy
          # (restrict,command=...), so it can only deploy a SHA or read status.
          # The host key is pinned too (no trust-on-first-use): we pipe a GHCR
          # token over this channel.
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_SSH_HOST_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY and DEPLOY_SSH_HOST_KEY must be set in the deploy environment"
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          KH="$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > "$KH"
          chmod 644 "$KH"
          echo "SSH_OPTS=-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KH" >> "$GITHUB_ENV"
      - name: Deploy
        run: |
          case "$DEPLOY_MODE" in
            normal)  ./deploy/deploy.sh ;;
            fresh)   ./deploy/deploy.sh --fresh ;;
            restore) ./deploy/deploy.sh --restore ;;
            *)
              echo "refusing deploy mode that was not accepted" >&2
              exit 1
              ;;
          esac
        env:
          DEPLOY_MODE: ${{ steps.deploy_inputs.outputs.mode }}
          DEPLOY_SHA: ${{ steps.deploy_inputs.outputs.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          # The job token can read this repo's GHCR package for the length of
          # the job; the host logs in with a throwaway docker config and logs
          # out after the pull, so nothing long-lived is stored anywhere.
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
