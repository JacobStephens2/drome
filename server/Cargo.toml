[package]
name = "drome-server"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
name = "drome_server"
path = "src/lib.rs"

[[bin]]
name = "drome-server"
path = "src/main.rs"

[dependencies]
# Shared event/config wire types + validation live in the client core.
drome-core = { path = "../core" }

axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.40", features = ["bundled"] }

# Apple identity-token (RS256) verification.
jsonwebtoken = "9"
# Session-token hashing at rest + random token bytes.
sha2 = "0.10"
rand = "0.8"
# JWKS fetch for the production Apple verifier (a pure-sync client with no
# async runtime, so it is safe to call from an Axum handler; tests inject a
# mock JWKS and never touch the network).
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
# Signs test Apple identity tokens with a throwaway RSA key.
jsonwebtoken = "9"
serde_json = "1"
# The integration test drives two real client stores against the server.
drome-core = { path = "../core" }
tower = { version = "0.5", features = ["util"] }
