.h2sub{color:var(--ink-soft);font-size:14px;margin:0 0 24px;}
.row{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:center;}
figure{margin:0;text-align:center;} svg{width:360px;max-width:90vw;height:auto;}
.outline{fill:none;stroke:var(--ink);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;}
.clay{stroke:var(--camel);stroke-width:6.5;}
figcaption{color:var(--ink-soft);font-size:14px;margin-top:8px;}
