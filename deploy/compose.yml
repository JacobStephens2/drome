# Drome production stack on stephens.page (moved from the drome-prod droplet
# on 2026-11-26). Lives at /srv/drome/compose.yml. Deploys do NOT copy this
# file: drome-deploy only changes IMAGE_TAG in /srv/drome/.env. After editing
# it here, copy it to the host by hand and run `docker compose up -d` there.
#
#   drome-server  the Axum API (GHCR image pinned to a git SHA, NEVER :latest)
#   litestream    sidecar, continuously replicates the SQLite DB to R2
#
# Apache on the host terminates TLS for drome.day, proxies /v1/* and /healthz
# to 127.0.0.1:8095, and serves /srv/drome/web for everything else.
#
# Durable state: /srv/drome/data/drome (owned by uid 10001). Secrets: only in
# /srv/drome/.env (shape in .env.template). Nothing secret is committed.
name: drome

services:
  drome-server:
    image: ${IMAGE_TAG} # ghcr.io/jacobstephens2/drome-server:<git-sha>, set by drome-deploy
    restart: unless-stopped
    env_file: .env
    environment:
      # DB path is INSIDE the container, on the bind-mounted data dir.
      DROME_DB: /data/drome/drome-server.sqlite
      DROME_BIND: 0.0.0.0:8080
      BETA_ALL_ENTITLED: ${BETA_ALL_ENTITLED:-true}
      # DROME_DEV_AUTH is intentionally NEVER set here: the dev auth route must
      # not exist in production (docs/PHASE2.md).
    volumes:
      - ./data/drome:/data/drome
    ports:
      - "127.0.0.1:8095:8080" # loopback only; Apache is the public edge
    healthcheck:
      # The runtime image is debian-slim with curl; /healthz touches the DB.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  litestream:
    # Pinned to an exact patch, NEVER the floating `0.3` tag. The replica
    # storage layout changed incompatibly at 0.5, so a newer image would be
    # format-incompatible with the existing R2 replica (a data-recovery hazard).
    # 0.3.14 is the highest 0.3.x release. Only ONE litestream may replicate to
    # the R2 path at a time.
    image: litestream/litestream:0.3.14
    restart: unless-stopped
    # Same uid as drome-server (server/Dockerfile: uid 10001) so restored and
    # replicated DB files stay openable by the server. `drome-deploy ... restore`
    # does `compose run` on this service, so a restored DB inherits this uid.
    user: "10001:10001"
    depends_on: [drome-server]
    command: ["replicate"]
    env_file: .env # supplies LITESTREAM_R2_* used by litestream.yml
    volumes:
      - ./data/drome:/data/drome
      - ./litestream.yml:/etc/litestream.yml:ro
